name: sqabyfood_sqaby
description: SqabyFood by Sqaby.
publish_to: 'none' #
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.6.5

  shared_preferences: ^2.0.20
  connectivity: ^3.0.6
  firebase_core: ^2.13.1
  firebase_messaging: ^14.2.1
  flutter_local_notifications: ^13.0.0
  path_provider: ^2.0.15 
  url_strategy: ^0.2.0
  pin_code_fields: ^7.4.0
  geolocator: ^9.0.2 
  google_maps_flutter: ^2.2.5
  google_maps_flutter_web: ^0.4.0+7
  flutter_typeahead: ^ 4.6.1 
  carousel_slider: ^4.2.1
  shimmer_animation: ^2.1.0+1
  image_picker: ^0.8.7+5
  universal_html: ^2.2.3
  flutter_inappwebview: ^5.7.2+3 
  flutter_widget_from_html_core: ^0.10.1
  url_launcher: ^6.1.11
  http: ^0.13.5
  pointer_interceptor: ^0.9.3+4
  phone_number: ^2.0.1
  country_code_picker: ^2.0.2
  cached_network_image: ^3.2.3
  photo_view: ^0.14.0
  dotted_border: ^2.0.0+3
  share_plus: ^ 7.0.2 
  fwfh_text_style: ^2.22.8+1
  flutter_launcher_icons: ^0.12.0

  
flutter_icons:
   android: true
   ios: true
   image_path: "assets/image/logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
dependency_overrides:
  modal_bottom_sheet: ^3.0.0-pre
 
flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900